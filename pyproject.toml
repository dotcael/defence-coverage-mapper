[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "defence-coverage-mapper"
version = "0.1.0"
description = "Converts inconsistent block logs into a structured defence coverage map"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
defence-map = "mapper:cli_main"

[tool.setuptools]
py-modules = ["mapper"]
